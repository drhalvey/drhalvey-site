<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="900" height="1020" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="900" height="1020" fill="#ffffff"/>
<defs><marker id="a-maroon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#4e1d24"/></marker><marker id="s-maroon" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#4e1d24"/></marker><marker id="a-sand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#d98b3c"/></marker><marker id="s-sand" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#d98b3c"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#8a7b74"/></marker><marker id="s-grey" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#8a7b74"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#b02e2e"/></marker><marker id="s-danger" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#b02e2e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#241a18"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#241a18"/></marker></defs>
<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Cementing a femoral stem: what happens, and what you do, at each point</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">The embolic load begins as the cement goes in, is worst in the minutes after the stem, and returns at reduction. The right ventricle is the</text>
<text x="24.0" y="75.2" font-size="13" fill="#8a7b74">organ that fails.</text>
<text x="24.0" y="146.4" font-size="13" fill="#4e1d24" font-weight="bold">Embolic load</text>
<text x="24.0" y="163.4" font-size="13" fill="#8a7b74">(schematic)</text>
<line x1="142.0" y1="186.4" x2="876.0" y2="186.4" stroke="#8a7b74" stroke-width="1.2" stroke-linecap="round"/>
<path d="M142.0,186.4 L142.0,186.4 L159.9,186.4 L184.4,186.4 L213.9,186.4 L246.7,186.4 L281.2,186.4 L315.9,186.4 L349.0,186.4 L379.0,186.4 L404.3,186.4 L423.2,186.4 L435.7,186.1 L443.5,185.9 L447.5,185.7 L448.6,185.5 L447.7,185.2 L445.8,184.7 L443.6,184.0 L442.3,183.1 L442.5,181.9 L445.4,180.4 L450.2,178.4 L455.8,176.0 L461.9,173.3 L468.5,170.3 L475.5,167.2 L482.7,163.9 L490.1,160.8 L497.5,157.7 L504.8,154.9 L512.0,152.4 L519.2,150.2 L526.6,148.2 L534.1,146.3 L541.8,144.5 L549.5,142.8 L557.1,141.1 L564.7,139.5 L572.0,137.8 L579.2,136.2 L586.0,134.4 L592.6,132.4 L598.9,130.1 L605.1,127.6 L611.1,125.1 L617.0,122.7 L622.8,120.4 L628.5,118.6 L634.1,117.2 L639.6,116.4 L645.2,116.4 L650.7,117.3 L656.2,119.0 L661.5,121.3 L666.8,124.2 L672.0,127.4 L677.2,130.8 L682.2,134.1 L687.2,137.3 L692.2,140.1 L697.0,142.4 L701.8,144.4 L706.6,146.4 L711.3,148.4 L716.0,150.3 L720.6,152.0 L725.1,153.5 L729.4,154.8 L733.6,155.7 L737.6,156.3 L741.4,156.4 L744.9,155.8 L748.1,154.5 L751.1,152.6 L754.0,150.3 L756.7,147.9 L759.3,145.5 L762.0,143.4 L764.8,141.6 L767.8,140.6 L771.0,140.4 L774.3,141.1 L777.5,142.4 L780.6,144.3 L783.8,146.6 L787.2,149.2 L790.7,152.0 L794.5,154.8 L798.6,157.6 L803.1,160.2 L808.0,162.4 L813.8,164.5 L820.5,166.7 L827.9,168.9 L835.7,171.1 L843.6,173.3 L851.3,175.3 L858.6,177.2 L865.1,178.9 L870.5,180.3 L874.6,181.4 L874.6,186.4 Z" fill="#f0d5d5" stroke="#b02e2e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="645.2" y="110.4" font-size="13" fill="#b02e2e" text-anchor="middle" font-weight="bold">worst here</text>
<text x="784.4" y="134.4" font-size="13" fill="#b02e2e" font-weight="bold">again</text>
<rect x="142.0" y="200.4" width="142.0" height="40.0" rx="5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="213.0" y="225.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Before the list</text>
<line x1="282.0" y1="220.4" x2="291.0" y2="220.4" stroke="#4e1d24" stroke-width="2" stroke-linecap="round"/>
<rect x="290.0" y="200.4" width="142.0" height="40.0" rx="5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="361.0" y="225.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Canal preparation</text>
<line x1="430.0" y1="220.4" x2="439.0" y2="220.4" stroke="#4e1d24" stroke-width="2" stroke-linecap="round"/>
<rect x="438.0" y="200.4" width="142.0" height="40.0" rx="5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="509.0" y="217.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Cement in and</text>
<text x="509.0" y="232.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">pressurised</text>
<line x1="578.0" y1="220.4" x2="587.0" y2="220.4" stroke="#4e1d24" stroke-width="2" stroke-linecap="round"/>
<rect x="586.0" y="200.4" width="142.0" height="40.0" rx="5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="657.0" y="225.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Stem insertion</text>
<line x1="726.0" y1="220.4" x2="735.0" y2="220.4" stroke="#4e1d24" stroke-width="2" stroke-linecap="round"/>
<rect x="734.0" y="200.4" width="142.0" height="40.0" rx="5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="805.0" y="225.4" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Reduction and after</text>
<text x="24.0" y="270.4" font-size="14" fill="#4e1d24" font-weight="bold">Surgeon</text>
<rect x="142.0" y="248.4" width="142.0" height="138.4" rx="5" fill="#ffffff" stroke="#8a7b74" stroke-width="1.5" />
<text x="149.0" y="268.4" font-size="13" fill="#241a18">Chooses cemented</text>
<text x="149.0" y="285.6" font-size="13" fill="#241a18">or uncemented</text>
<text x="149.0" y="302.8" font-size="13" fill="#241a18">knowing who is at</text>
<text x="149.0" y="320.0" font-size="13" fill="#241a18">risk.</text>
<rect x="290.0" y="248.4" width="142.0" height="138.4" rx="5" fill="#ffffff" stroke="#8a7b74" stroke-width="1.5" />
<text x="297.0" y="268.4" font-size="13" fill="#241a18">Broach; pulsed</text>
<text x="297.0" y="285.6" font-size="13" fill="#241a18">lavage and suction to</text>
<text x="297.0" y="302.8" font-size="13" fill="#241a18">a dry canal; distal</text>
<text x="297.0" y="320.0" font-size="13" fill="#241a18">restrictor; vent or</text>
<text x="297.0" y="337.2" font-size="13" fill="#241a18">suction catheter.</text>
<rect x="438.0" y="248.4" width="142.0" height="138.4" rx="5" fill="#ffffff" stroke="#8a7b74" stroke-width="1.5" />
<text x="445.0" y="268.4" font-size="13" fill="#241a18">Says "cementing</text>
<text x="445.0" y="285.6" font-size="13" fill="#241a18">now".</text>
<text x="445.0" y="302.8" font-size="13" fill="#241a18">Vacuum-mixed</text>
<text x="445.0" y="320.0" font-size="13" fill="#241a18">cement by gun,</text>
<text x="445.0" y="337.2" font-size="13" fill="#241a18">retrograde;</text>
<text x="445.0" y="354.4" font-size="13" fill="#241a18">restrained</text>
<text x="445.0" y="371.6" font-size="13" fill="#241a18">pressurisation.</text>
<rect x="586.0" y="248.4" width="142.0" height="138.4" rx="5" fill="#ffffff" stroke="#8a7b74" stroke-width="1.5" />
<text x="593.0" y="268.4" font-size="13" fill="#241a18">Steady, not forceful.</text>
<text x="593.0" y="285.6" font-size="13" fill="#241a18">Stops and holds the</text>
<text x="593.0" y="302.8" font-size="13" fill="#241a18">stem if you call an</text>
<text x="593.0" y="320.0" font-size="13" fill="#241a18">event.</text>
<rect x="734.0" y="248.4" width="142.0" height="138.4" rx="5" fill="#ffffff" stroke="#8a7b74" stroke-width="1.5" />
<text x="741.0" y="268.4" font-size="13" fill="#241a18">Reduces slowly, and</text>
<text x="741.0" y="285.6" font-size="13" fill="#241a18">only when told.</text>
<text x="741.0" y="302.8" font-size="13" fill="#241a18">Closes.</text>
<text x="24.0" y="416.8" font-size="14" fill="#4e1d24" font-weight="bold">Physiology</text>
<rect x="142.0" y="394.8" width="142.0" height="138.4" rx="5" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="149.0" y="414.8" font-size="13" fill="#241a18">A fracture patient</text>
<text x="149.0" y="432.0" font-size="13" fill="#241a18">arrives dry; a spinal</text>
<text x="149.0" y="449.2" font-size="13" fill="#241a18">removes</text>
<text x="149.0" y="466.4" font-size="13" fill="#241a18">sympathetic tone.</text>
<rect x="290.0" y="394.8" width="142.0" height="138.4" rx="5" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="297.0" y="414.8" font-size="13" fill="#241a18">Marrow and fat</text>
<text x="297.0" y="432.0" font-size="13" fill="#241a18">washed out now</text>
<text x="297.0" y="449.2" font-size="13" fill="#241a18">cannot be injected</text>
<text x="297.0" y="466.4" font-size="13" fill="#241a18">later. Most of the</text>
<text x="297.0" y="483.6" font-size="13" fill="#241a18">dose reduction is</text>
<text x="297.0" y="500.8" font-size="13" fill="#241a18">here.</text>
<rect x="438.0" y="394.8" width="142.0" height="138.4" rx="5" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="445.0" y="414.8" font-size="13" fill="#241a18">The canal is a closed</text>
<text x="445.0" y="432.0" font-size="13" fill="#241a18">tube: pressure rises</text>
<text x="445.0" y="449.2" font-size="13" fill="#241a18">to several hundred</text>
<text x="445.0" y="466.4" font-size="13" fill="#241a18">mmHg. Fat,</text>
<text x="445.0" y="483.6" font-size="13" fill="#241a18">marrow, air and</text>
<text x="445.0" y="500.8" font-size="13" fill="#241a18">debris enter the</text>
<text x="445.0" y="518.0" font-size="13" fill="#241a18">veins.</text>
<rect x="586.0" y="394.8" width="142.0" height="138.4" rx="5" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="593.0" y="414.8" font-size="13" fill="#241a18">Emboli reach the</text>
<text x="593.0" y="432.0" font-size="13" fill="#241a18">right atrium in 30-60</text>
<text x="593.0" y="449.2" font-size="13" fill="#241a18">s. Pulmonary</text>
<text x="593.0" y="466.4" font-size="13" fill="#241a18">resistance rises, the</text>
<text x="593.0" y="483.6" font-size="13" fill="#241a18">right ventricle</text>
<text x="593.0" y="500.8" font-size="13" fill="#241a18">dilates, the left heart</text>
<text x="593.0" y="518.0" font-size="13" fill="#241a18">empties.</text>
<rect x="734.0" y="394.8" width="142.0" height="138.4" rx="5" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="741.0" y="414.8" font-size="13" fill="#241a18">A second surge at</text>
<text x="741.0" y="432.0" font-size="13" fill="#241a18">reduction. Usually</text>
<text x="741.0" y="449.2" font-size="13" fill="#241a18">over in 20-30 min as</text>
<text x="741.0" y="466.4" font-size="13" fill="#241a18">the pulmonary bed</text>
<text x="741.0" y="483.6" font-size="13" fill="#241a18">clears.</text>
<text x="24.0" y="563.2" font-size="14" fill="#4e1d24" font-weight="bold">Anaesthetist</text>
<rect x="142.0" y="541.2" width="142.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="149.0" y="561.2" font-size="13" fill="#241a18">Name the at-risk</text>
<text x="149.0" y="578.4" font-size="13" fill="#241a18">patient at the brief.</text>
<text x="149.0" y="595.6" font-size="13" fill="#241a18">Fluid before the</text>
<text x="149.0" y="612.8" font-size="13" fill="#241a18">spinal. Arterial line</text>
<text x="149.0" y="630.0" font-size="13" fill="#241a18">for ASA III-IV.</text>
<rect x="290.0" y="541.2" width="142.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="297.0" y="561.2" font-size="13" fill="#241a18">Ask for the surgical</text>
<text x="297.0" y="578.4" font-size="13" fill="#241a18">bundle. Pressure at</text>
<text x="297.0" y="595.6" font-size="13" fill="#241a18">or near baseline.</text>
<text x="297.0" y="612.8" font-size="13" fill="#241a18">Vasopressor drawn</text>
<text x="297.0" y="630.0" font-size="13" fill="#241a18">up; running if at risk.</text>
<rect x="438.0" y="541.2" width="142.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="445.0" y="561.2" font-size="13" fill="#241a18">Acknowledge the</text>
<text x="445.0" y="578.4" font-size="13" fill="#241a18">warning. Oxygen up.</text>
<text x="445.0" y="595.6" font-size="13" fill="#241a18">No nitrous oxide. At</text>
<text x="445.0" y="612.8" font-size="13" fill="#241a18">the head, not the</text>
<text x="445.0" y="630.0" font-size="13" fill="#241a18">chart, for five</text>
<text x="445.0" y="647.2" font-size="13" fill="#241a18">minutes.</text>
<rect x="586.0" y="541.2" width="142.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="593.0" y="561.2" font-size="13" fill="#241a18">Watch end-tidal CO2</text>
<text x="593.0" y="578.4" font-size="13" fill="#241a18">first, then saturation,</text>
<text x="593.0" y="595.6" font-size="13" fill="#241a18">then pressure.</text>
<text x="593.0" y="612.8" font-size="13" fill="#241a18">Under a spinal:</text>
<text x="593.0" y="630.0" font-size="13" fill="#241a18">restless, breathless,</text>
<text x="593.0" y="647.2" font-size="13" fill="#241a18">confused.</text>
<rect x="734.0" y="541.2" width="142.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="741.0" y="561.2" font-size="13" fill="#241a18">Stay vigilant through</text>
<text x="741.0" y="578.4" font-size="13" fill="#241a18">reduction. Grade</text>
<text x="741.0" y="595.6" font-size="13" fill="#241a18">what happened and</text>
<text x="741.0" y="612.8" font-size="13" fill="#241a18">write it down.</text>
<rect x="24.0" y="676.4" width="852.0" height="74.6" rx="6" fill="#f0d5d5" stroke="#b02e2e" stroke-width="1.5" />
<text x="33.0" y="698.4" font-size="13" fill="#b02e2e" font-weight="bold">If it happens: treat acute right heart failure</text>
<text x="33.0" y="718.6" font-size="13" fill="#241a18">Say it out loud; the surgeon stops. 100% oxygen. Fluid 250-500 mL, then reassess. Metaraminol or noradrenaline first; adrenaline in</text>
<text x="33.0" y="735.8" font-size="13" fill="#241a18">10-50 microgram increments if the pressure does not respond or the heart rate falls. Chest compressions at once if the pulse is lost.</text>
<rect x="24.0" y="767.0" width="852.0" height="65.6" rx="0" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="31.0" y="786.0" font-size="13" fill="#ffffff" font-weight="bold">Grade</text>
<text x="127.0" y="786.0" font-size="13" fill="#ffffff" font-weight="bold">Definition</text>
<text x="457.0" y="786.0" font-size="13" fill="#ffffff" font-weight="bold">Cemented</text>
<text x="457.0" y="803.2" font-size="13" fill="#ffffff" font-weight="bold">hemiarthroplasty for</text>
<text x="457.0" y="820.4" font-size="13" fill="#ffffff" font-weight="bold">fracture</text>
<text x="607.0" y="786.0" font-size="13" fill="#ffffff" font-weight="bold">Early mortality</text>
<text x="737.0" y="786.0" font-size="13" fill="#ffffff" font-weight="bold">What it needs</text>
<rect x="24.0" y="832.6" width="96.0" height="48.4" rx="0" fill="#f7e6d2" stroke="none" stroke-width="0" />
<text x="31.0" y="851.6" font-size="13" fill="#4e1d24" font-weight="bold">Grade 1</text>
<text x="127.0" y="851.6" font-size="13" fill="#241a18">SpO2 below 94%, or systolic pressure down</text>
<text x="127.0" y="868.8" font-size="13" fill="#241a18">20-40%.</text>
<text x="457.0" y="851.6" font-size="13" fill="#241a18">21%</text>
<text x="607.0" y="851.6" font-size="13" fill="#241a18">9.3%</text>
<text x="737.0" y="851.6" font-size="13" fill="#241a18">The vasopressor</text>
<text x="737.0" y="868.8" font-size="13" fill="#241a18">already running.</text>
<line x1="24.0" y1="881.0" x2="876.0" y2="881.0" stroke="#8a7b74" stroke-width="1" stroke-linecap="round"/>
<rect x="24.0" y="881.0" width="96.0" height="48.4" rx="0" fill="#d98b3c" stroke="none" stroke-width="0" />
<text x="31.0" y="900.0" font-size="13" fill="#4e1d24" font-weight="bold">Grade 2</text>
<text x="127.0" y="900.0" font-size="13" fill="#241a18">SpO2 below 88%, or systolic pressure down more</text>
<text x="127.0" y="917.2" font-size="13" fill="#241a18">than 40%, or unexpected loss of consciousness.</text>
<text x="457.0" y="900.0" font-size="13" fill="#241a18">5.1%</text>
<text x="607.0" y="900.0" font-size="13" fill="#241a18">35%</text>
<text x="737.0" y="900.0" font-size="13" fill="#241a18">The full sequence</text>
<text x="737.0" y="917.2" font-size="13" fill="#241a18">above.</text>
<line x1="24.0" y1="929.4" x2="876.0" y2="929.4" stroke="#8a7b74" stroke-width="1" stroke-linecap="round"/>
<rect x="24.0" y="929.4" width="96.0" height="48.4" rx="0" fill="#f0d5d5" stroke="none" stroke-width="0" />
<text x="31.0" y="948.4" font-size="13" fill="#4e1d24" font-weight="bold">Grade 3</text>
<text x="127.0" y="948.4" font-size="13" fill="#241a18">Cardiovascular collapse requiring cardiopulmonary</text>
<text x="127.0" y="965.6" font-size="13" fill="#241a18">resuscitation.</text>
<text x="457.0" y="948.4" font-size="13" fill="#241a18">1.7%</text>
<text x="607.0" y="948.4" font-size="13" fill="#241a18">88%</text>
<text x="737.0" y="948.4" font-size="13" fill="#241a18">Everything,</text>
<text x="737.0" y="965.6" font-size="13" fill="#241a18">immediately.</text>
<line x1="24.0" y1="977.8" x2="876.0" y2="977.8" stroke="#8a7b74" stroke-width="1" stroke-linecap="round"/>
