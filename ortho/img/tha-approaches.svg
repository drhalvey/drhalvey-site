<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="900" height="758" fill="#ffffff"/>
<defs><marker id="a-maroon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#4e1d24"/></marker><marker id="s-maroon" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#4e1d24"/></marker><marker id="a-sand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#d98b3c"/></marker><marker id="s-sand" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#d98b3c"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#8a7b74"/></marker><marker id="s-grey" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#8a7b74"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#b02e2e"/></marker><marker id="s-danger" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#b02e2e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#241a18"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#241a18"/></marker></defs>
<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Three ways into a hip</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Schematic section through the hip, not to scale. The way in decides the position, the nerve at risk and the muscle that hurts afterwards.</text>
<path d="M190,250 Q150,300 190,350 L168,364 Q118,300 168,236 Z" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
<rect x="246.0" y="282.0" width="52.0" height="64.0" rx="16" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5" />
<circle cx="206.0" cy="300.0" r="34" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5"/>
<rect x="222.0" y="290.0" width="40.0" height="26.0" rx="0" fill="#f3e9d8" stroke="none" stroke-width="0" />
<text x="206.0" y="305.0" font-size="13" fill="#8a7b74" text-anchor="middle">head</text>
<text x="60.0" y="366.0" font-size="13" fill="#8a7b74">pelvis</text>
<line x1="100.0" y1="360.0" x2="146.0" y2="336.0" stroke="#8a7b74" stroke-width="1.2" stroke-linecap="round"/>
<rect x="110.0" y="150.0" width="98.0" height="36.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="159.0" y="173.0" font-size="13" fill="#241a18" text-anchor="middle">sartorius</text>
<rect x="232.0" y="150.0" width="150.0" height="36.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="307.0" y="173.0" font-size="13" fill="#241a18" text-anchor="middle">tensor fasciae latae</text>
<rect x="108.0" y="200.0" width="122.0" height="34.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="169.0" y="222.0" font-size="13" fill="#241a18" text-anchor="middle">rectus femoris</text>
<rect x="312.0" y="212.0" width="86.0" height="132.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="355.0" y="274.5" font-size="13" fill="#241a18" text-anchor="middle">gluteus</text>
<text x="355.0" y="291.5" font-size="13" fill="#241a18" text-anchor="middle">medius</text>
<rect x="150.0" y="364.0" width="180.0" height="34.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="162.0" y="386.0" font-size="13" fill="#241a18">short rotators</text>
<rect x="96.0" y="442.0" width="300.0" height="40.0" rx="12" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="108.0" y="467.0" font-size="13" fill="#241a18">gluteus maximus</text>
<circle cx="84.0" cy="218.0" r="9" fill="#e6c34a" stroke="#4e1d24" stroke-width="1.5"/>
<text x="30.0" y="250.0" font-size="13" fill="#241a18">femoral</text>
<text x="30.0" y="266.0" font-size="13" fill="#241a18">nerve</text>
<circle cx="220.0" cy="140.0" r="7" fill="#e6c34a" stroke="#4e1d24" stroke-width="1.5"/>
<text x="250.0" y="126.0" font-size="13" fill="#241a18">lateral femoral cutaneous nerve</text>
<line x1="229.0" y1="136.0" x2="246.0" y2="126.0" stroke="#8a7b74" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="386.0" cy="228.0" r="7" fill="#e6c34a" stroke="#4e1d24" stroke-width="1.5"/>
<text x="408.0" y="222.0" font-size="13" fill="#241a18">superior</text>
<text x="408.0" y="238.0" font-size="13" fill="#241a18">gluteal</text>
<text x="408.0" y="254.0" font-size="13" fill="#241a18">nerve</text>
<circle cx="226.0" cy="420.0" r="11" fill="#e6c34a" stroke="#4e1d24" stroke-width="1.5"/>
<text x="206.0" y="425.0" font-size="13" fill="#241a18" text-anchor="end">sciatic nerve</text>
<path d="M220,100 L220,188 Q262,228 236,262" fill="none" stroke="#d98b3c" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-sand)" />
<circle cx="220.0" cy="96.0" r="13" fill="#d98b3c" stroke="#d98b3c" stroke-width="1"/>
<text x="220.0" y="101.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<line x1="446.0" y1="314.0" x2="304.0" y2="314.0" stroke="#4e1d24" stroke-width="3.2" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<circle cx="452.0" cy="314.0" r="13" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="452.0" y="319.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">L</text>
<line x1="286.0" y1="512.0" x2="286.0" y2="352.0" stroke="#241a18" stroke-width="3.2" stroke-linecap="round" marker-end="url(#a-ink)"/>
<circle cx="286.0" cy="518.0" r="13" fill="#241a18" stroke="#241a18" stroke-width="1"/>
<text x="286.0" y="523.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">P</text>
<text x="30.0" y="108.0" font-size="13" fill="#8a7b74" font-weight="bold">FRONT</text>
<text x="30.0" y="524.0" font-size="13" fill="#8a7b74" font-weight="bold">BACK</text>
<text x="30.0" y="320.0" font-size="13" fill="#8a7b74">medial</text>
<text x="420.0" y="360.0" font-size="13" fill="#8a7b74">lateral</text>
<circle cx="36.0" cy="556.0" r="8" fill="#e6c34a" stroke="#4e1d24" stroke-width="1.5"/>
<text x="52.0" y="561.0" font-size="13" fill="#241a18">nerve at risk</text>
<rect x="170.0" y="548.0" width="26.0" height="16.0" rx="6" fill="#d9a6a0" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="204.0" y="561.0" font-size="13" fill="#241a18">muscle</text>
<rect x="270.0" y="548.0" width="26.0" height="16.0" rx="6" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5" />
<text x="304.0" y="561.0" font-size="13" fill="#241a18">bone</text>
<rect x="486.0" y="86.0" width="390.0" height="245.2" rx="6" fill="#faf6ef" stroke="#d98b3c" stroke-width="1.8" />
<circle cx="508.0" cy="108.0" r="13" fill="#d98b3c" stroke="#d98b3c" stroke-width="1"/>
<text x="508.0" y="113.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text>
<text x="530.0" y="113.0" font-size="15" fill="#4e1d24" font-weight="bold">Direct anterior</text>
<text x="498.0" y="138.0" font-size="13" fill="#4e1d24" font-weight="bold">Through</text>
<text x="566.0" y="138.0" font-size="13" fill="#241a18">Between tensor fasciae latae and sartorius, then</text>
<text x="566.0" y="155.2" font-size="13" fill="#241a18">rectus femoris and gluteus medius. No muscle</text>
<text x="566.0" y="172.4" font-size="13" fill="#241a18">cut.</text>
<text x="498.0" y="193.6" font-size="13" fill="#4e1d24" font-weight="bold">Nerve</text>
<text x="566.0" y="193.6" font-size="13" fill="#241a18">Lateral femoral cutaneous: numbness in most</text>
<text x="566.0" y="210.8" font-size="13" fill="#241a18">patients. Femoral nerve from retractors and the</text>
<text x="566.0" y="228.0" font-size="13" fill="#241a18">extended leg.</text>
<text x="498.0" y="249.2" font-size="13" fill="#4e1d24" font-weight="bold">Position</text>
<text x="566.0" y="249.2" font-size="13" fill="#241a18">Supine, with or without a traction table and</text>
<text x="566.0" y="266.4" font-size="13" fill="#241a18">perineal post.</text>
<text x="498.0" y="287.6" font-size="13" fill="#4e1d24" font-weight="bold">Price</text>
<text x="566.0" y="287.6" font-size="13" fill="#241a18">The femoral exposure: calcar cracks and</text>
<text x="566.0" y="304.8" font-size="13" fill="#241a18">trochanteric fractures. No hip precautions</text>
<text x="566.0" y="322.0" font-size="13" fill="#241a18">afterwards.</text>
<rect x="486.0" y="343.2" width="390.0" height="193.6" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.8" />
<circle cx="508.0" cy="365.2" r="13" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="508.0" y="370.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">L</text>
<text x="530.0" y="370.2" font-size="15" fill="#4e1d24" font-weight="bold">Direct lateral</text>
<text x="498.0" y="395.2" font-size="13" fill="#4e1d24" font-weight="bold">Through</text>
<text x="566.0" y="395.2" font-size="13" fill="#241a18">Gluteus medius and vastus lateralis, split and</text>
<text x="566.0" y="412.4" font-size="13" fill="#241a18">repaired.</text>
<text x="498.0" y="433.6" font-size="13" fill="#4e1d24" font-weight="bold">Nerve</text>
<text x="566.0" y="433.6" font-size="13" fill="#241a18">Superior gluteal, about 5 cm above the</text>
<text x="566.0" y="450.8" font-size="13" fill="#241a18">trochanter, cut if the split runs too high.</text>
<text x="498.0" y="472.0" font-size="13" fill="#4e1d24" font-weight="bold">Position</text>
<text x="566.0" y="472.0" font-size="13" fill="#241a18">Lateral decubitus with pelvic clamps, or supine</text>
<text x="566.0" y="489.2" font-size="13" fill="#241a18">in some hands.</text>
<text x="498.0" y="510.4" font-size="13" fill="#4e1d24" font-weight="bold">Price</text>
<text x="566.0" y="510.4" font-size="13" fill="#241a18">A limp for weeks: the one muscle-under-tension</text>
<text x="566.0" y="527.6" font-size="13" fill="#241a18">mechanism of the three.</text>
<rect x="486.0" y="548.8" width="390.0" height="193.6" rx="6" fill="#faf6ef" stroke="#241a18" stroke-width="1.8" />
<circle cx="508.0" cy="570.8" r="13" fill="#241a18" stroke="#241a18" stroke-width="1"/>
<text x="508.0" y="575.8" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">P</text>
<text x="530.0" y="575.8" font-size="15" fill="#4e1d24" font-weight="bold">Posterior</text>
<text x="498.0" y="600.8" font-size="13" fill="#4e1d24" font-weight="bold">Through</text>
<text x="566.0" y="600.8" font-size="13" fill="#241a18">Gluteus maximus split along its fibres; short</text>
<text x="566.0" y="618.0" font-size="13" fill="#241a18">external rotators and posterior capsule</text>
<text x="566.0" y="635.2" font-size="13" fill="#241a18">detached, then repaired.</text>
<text x="498.0" y="656.4" font-size="13" fill="#4e1d24" font-weight="bold">Nerve</text>
<text x="566.0" y="656.4" font-size="13" fill="#241a18">Sciatic, a centimetre or two behind the rotators.</text>
<text x="498.0" y="677.6" font-size="13" fill="#4e1d24" font-weight="bold">Position</text>
<text x="566.0" y="677.6" font-size="13" fill="#241a18">Lateral decubitus, pelvis clamped at pubis and</text>
<text x="566.0" y="694.8" font-size="13" fill="#241a18">sacrum.</text>
<text x="498.0" y="716.0" font-size="13" fill="#4e1d24" font-weight="bold">Price</text>
<text x="566.0" y="716.0" font-size="13" fill="#241a18">A reputation for dislocation, largely removed by</text>
<text x="566.0" y="733.2" font-size="13" fill="#241a18">the repair. Abductors spared.</text>
<rect x="24.0" y="590.0" width="446.0" height="91.8" rx="6" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5" />
<text x="33.0" y="612.0" font-size="13" fill="#4e1d24" font-weight="bold">The same for all three</text>
<text x="33.0" y="632.2" font-size="13" fill="#241a18">Reaming and broaching are the pain: bone, score 2. Spinal with</text>
<text x="33.0" y="649.4" font-size="13" fill="#241a18">surgeon infiltration, no catheter, and the cemented stem is the one</text>
<text x="33.0" y="666.6" font-size="13" fill="#241a18">cement step. All-cause revision is about 2% whichever way in.</text>
</svg>
