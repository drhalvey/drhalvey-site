<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Hip fracture: the capsule is the line between two operations</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Inside the capsule the head loses its blood supply and is replaced. Outside it the head is alive and the fracture is fixed.</text>
