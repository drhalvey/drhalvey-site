<rect x="190.0" y="215.0" width="62.0" height="400.0" rx="14" fill="#f3e9d8" stroke="none" stroke-width="0" />
<ellipse cx="128" cy="184" rx="96" ry="72" fill="none" stroke="#8a7b74" stroke-width="2" stroke-dasharray="7 5" transform="rotate(22 128 184)"/>
<text x="30.0" y="106.0" font-size="13" fill="#8a7b74">capsule</text>
<line x1="70.0" y1="110.0" x2="84.0" y2="124.0" stroke="#8a7b74" stroke-width="1.2" stroke-linecap="round"/>
<text x="112.0" y="185.0" font-size="13" fill="#8a7b74" text-anchor="middle">head</text>
<text x="221.0" y="470.0" font-size="13" fill="#8a7b74" text-anchor="middle">shaft</text>
<text x="292.0" y="186.0" font-size="13" fill="#8a7b74">greater</text>
<text x="292.0" y="202.0" font-size="13" fill="#8a7b74">trochanter</text>
<text x="150.0" y="344.0" font-size="13" fill="#8a7b74" text-anchor="end">lesser</text>
<text x="150.0" y="360.0" font-size="13" fill="#8a7b74" text-anchor="end">trochanter</text>
<line x1="154.0" y1="340.0" x2="178.0" y2="310.0" stroke="#8a7b74" stroke-width="1.2" stroke-linecap="round"/>
<path d="M186,146 L170,180 L178,204 L160,246" fill="none" stroke="#b02e2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M262,178 L236,224 L226,262 L188,296" fill="none" stroke="#b02e2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 4" />
<path d="M186,352 L214,340 L226,356 L256,342" fill="none" stroke="#b02e2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 5" />
<circle cx="175.0" cy="128.0" r="11" fill="#b02e2e" stroke="#b02e2e" stroke-width="1"/>
<text x="175.0" y="133.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<circle cx="272.0" cy="244.0" r="11" fill="#b02e2e" stroke="#b02e2e" stroke-width="1"/>
<text x="272.0" y="249.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<circle cx="276.0" cy="348.0" r="11" fill="#b02e2e" stroke="#b02e2e" stroke-width="1"/>
<text x="276.0" y="353.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="30.0" y="526.0" font-size="13" fill="#241a18">1  neck, inside the capsule</text>
<text x="30.0" y="546.0" font-size="13" fill="#241a18">2  intertrochanteric</text>
<text x="30.0" y="566.0" font-size="13" fill="#241a18">3  subtrochanteric</text>
<rect x="372.0" y="86.0" width="504.0" height="332.0" rx="8" fill="#ffffff" stroke="#4e1d24" stroke-width="1.8" />
<text x="384.0" y="110.0" font-size="15" fill="#4e1d24" font-weight="bold">Intracapsular</text>
<text x="384.0" y="130.0" font-size="13" fill="#8a7b74">Retinacular vessels torn: a displaced head will die if fixed.</text>
<text x="864.0" y="110.0" font-size="13" fill="#b02e2e" text-anchor="end" font-weight="bold">fracture line 1</text>
<rect x="384.0" y="144.0" width="153.3" height="262.0" rx="6" fill="#faf6ef" stroke="#8a7b74" stroke-width="1.2" />
<text x="392.0" y="164.0" font-size="13" fill="#4e1d24" font-weight="bold">Cannulated screws</text>
<text x="392.0" y="183.2" font-size="13" fill="#8a7b74" font-style="italic">Undisplaced</text>
<text x="392.0" y="204.4" font-size="13" fill="#241a18">Small lateral incision.</text>
<rect x="547.3" y="144.0" width="153.3" height="262.0" rx="6" fill="#faf6ef" stroke="#8a7b74" stroke-width="1.2" />
<text x="555.3" y="164.0" font-size="13" fill="#4e1d24" font-weight="bold">Cemented</text>
<text x="555.3" y="181.2" font-size="13" fill="#4e1d24" font-weight="bold">hemiarthroplasty</text>
<text x="555.3" y="200.4" font-size="13" fill="#8a7b74" font-style="italic">Displaced, most</text>
<text x="555.3" y="217.6" font-size="13" fill="#8a7b74" font-style="italic">patients</text>
<text x="555.3" y="238.8" font-size="13" fill="#241a18">Neck cut, canal</text>
<text x="555.3" y="256.0" font-size="13" fill="#241a18">prepared, stem</text>
<text x="555.3" y="273.2" font-size="13" fill="#241a18">cemented. The cement</text>
<text x="555.3" y="290.4" font-size="13" fill="#241a18">step with the most</text>
<text x="555.3" y="307.6" font-size="13" fill="#241a18">cement reactions in</text>
<text x="555.3" y="324.8" font-size="13" fill="#241a18">orthopaedics.</text>
<rect x="555.3" y="338.0" width="78.0" height="23.0" rx="11.5" fill="#b02e2e" stroke="#b02e2e" stroke-width="1" />
<text x="564.3" y="355.0" font-size="13" fill="#ffffff" font-weight="bold">CEMENT</text>
<rect x="555.3" y="368.0" width="85.2" height="23.0" rx="11.5" fill="#8a7b74" stroke="#8a7b74" stroke-width="1" />
<text x="564.3" y="385.0" font-size="13" fill="#ffffff" font-weight="bold">LATERAL</text>
<rect x="710.7" y="144.0" width="153.3" height="262.0" rx="6" fill="#faf6ef" stroke="#8a7b74" stroke-width="1.2" />
<text x="718.7" y="164.0" font-size="13" fill="#4e1d24" font-weight="bold">Total hip</text>
<text x="718.7" y="181.2" font-size="13" fill="#4e1d24" font-weight="bold">arthroplasty</text>
<text x="718.7" y="200.4" font-size="13" fill="#8a7b74" font-style="italic">Displaced, and fit,</text>
<text x="718.7" y="217.6" font-size="13" fill="#8a7b74" font-style="italic">independent,</text>
<text x="718.7" y="234.8" font-size="13" fill="#8a7b74" font-style="italic">cognitively intact</text>
<text x="718.7" y="256.0" font-size="13" fill="#241a18">Longer, more blood</text>
<text x="718.7" y="273.2" font-size="13" fill="#241a18">loss, more</text>
<text x="718.7" y="290.4" font-size="13" fill="#241a18">dislocation. Cemented</text>
<text x="718.7" y="307.6" font-size="13" fill="#241a18">or hybrid.</text>
<rect x="718.7" y="320.8" width="78.0" height="23.0" rx="11.5" fill="#b02e2e" stroke="#b02e2e" stroke-width="1" />
<text x="727.7" y="337.8" font-size="13" fill="#ffffff" font-weight="bold">CEMENT</text>
<rect x="718.7" y="350.8" width="85.2" height="23.0" rx="11.5" fill="#8a7b74" stroke="#8a7b74" stroke-width="1" />
<text x="727.7" y="367.8" font-size="13" fill="#ffffff" font-weight="bold">LATERAL</text>
<line x1="188.0" y1="128.0" x2="368.0" y2="146.0" stroke="#b02e2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" marker-end="url(#a-danger)"/>
<rect x="372.0" y="434.0" width="504.0" height="263.2" rx="8" fill="#ffffff" stroke="#4e1d24" stroke-width="1.8" />
<text x="384.0" y="458.0" font-size="15" fill="#4e1d24" font-weight="bold">Extracapsular</text>
<text x="384.0" y="478.0" font-size="13" fill="#8a7b74">Head alive; bleeds into the thigh, not the joint.</text>
<text x="864.0" y="458.0" font-size="13" fill="#b02e2e" text-anchor="end" font-weight="bold">fracture lines 2 and 3</text>
<rect x="384.0" y="492.0" width="235.0" height="193.2" rx="6" fill="#faf6ef" stroke="#8a7b74" stroke-width="1.2" />
<text x="392.0" y="512.0" font-size="13" fill="#4e1d24" font-weight="bold">Dynamic hip screw</text>
<text x="392.0" y="531.2" font-size="13" fill="#8a7b74" font-style="italic">Stable two-part intertrochanteric</text>
<text x="392.0" y="552.4" font-size="13" fill="#241a18">Lag screw sliding in a barrel on a</text>
<text x="392.0" y="569.6" font-size="13" fill="#241a18">lateral plate; approach through</text>
<text x="392.0" y="586.8" font-size="13" fill="#241a18">vastus lateralis.</text>
<rect x="392.0" y="600.0" width="141.5" height="23.0" rx="11.5" fill="#d98b3c" stroke="#d98b3c" stroke-width="1" />
<text x="401.0" y="617.0" font-size="13" fill="#ffffff" font-weight="bold">TRACTION TABLE</text>
<rect x="392.0" y="630.0" width="101.3" height="23.0" rx="11.5" fill="#8a7b74" stroke="#8a7b74" stroke-width="1" />
<text x="401.0" y="647.0" font-size="13" fill="#ffffff" font-weight="bold">NO CEMENT</text>
<rect x="629.0" y="492.0" width="235.0" height="193.2" rx="6" fill="#faf6ef" stroke="#8a7b74" stroke-width="1.2" />
<text x="637.0" y="512.0" font-size="13" fill="#4e1d24" font-weight="bold">Cephalomedullary nail</text>
<text x="637.0" y="531.2" font-size="13" fill="#8a7b74" font-style="italic">Unstable, reverse oblique or</text>
<text x="637.0" y="548.4" font-size="13" fill="#8a7b74" font-style="italic">subtrochanteric</text>
<text x="637.0" y="569.6" font-size="13" fill="#241a18">Entry through gluteus medius at the</text>
<text x="637.0" y="586.8" font-size="13" fill="#241a18">trochanteric tip; reamed; lag screw</text>
<text x="637.0" y="604.0" font-size="13" fill="#241a18">into the head.</text>
<rect x="637.0" y="617.2" width="141.5" height="23.0" rx="11.5" fill="#d98b3c" stroke="#d98b3c" stroke-width="1" />
<text x="646.0" y="634.2" font-size="13" fill="#ffffff" font-weight="bold">TRACTION TABLE</text>
<rect x="637.0" y="647.2" width="101.3" height="23.0" rx="11.5" fill="#8a7b74" stroke="#8a7b74" stroke-width="1" />
<text x="646.0" y="664.2" font-size="13" fill="#ffffff" font-weight="bold">NO CEMENT</text>
<line x1="286.0" y1="250.0" x2="368.0" y2="474.0" stroke="#b02e2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" marker-end="url(#a-danger)"/>
<line x1="290.0" y1="350.0" x2="368.0" y2="504.0" stroke="#b02e2e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4" marker-end="url(#a-danger)"/>
<rect x="24.0" y="713.2" width="277.3" height="99.6" rx="6" fill="#faf6ef" stroke="#b02e2e" stroke-width="1.8" />
<rect x="33.0" y="721.2" width="78.0" height="23.0" rx="11.5" fill="#b02e2e" stroke="#b02e2e" stroke-width="1" />
<text x="42.0" y="738.2" font-size="13" fill="#ffffff" font-weight="bold">CEMENT</text>
<text x="33.0" y="765.2" font-size="13" fill="#241a18">Pressure supported and a vasopressor</text>
<text x="33.0" y="782.4" font-size="13" fill="#241a18">running before the surgeon says the canal</text>
<text x="33.0" y="799.6" font-size="13" fill="#241a18">is being cemented.</text>
<rect x="311.3" y="713.2" width="277.3" height="99.6" rx="6" fill="#faf6ef" stroke="#d98b3c" stroke-width="1.8" />
<rect x="320.3" y="721.2" width="141.5" height="23.0" rx="11.5" fill="#d98b3c" stroke="#d98b3c" stroke-width="1" />
<text x="329.3" y="738.2" font-size="13" fill="#ffffff" font-weight="bold">TRACTION TABLE</text>
<text x="320.3" y="765.2" font-size="13" fill="#241a18">Supine, perineal post, image intensifier in</text>
<text x="320.3" y="782.4" font-size="13" fill="#241a18">the field. Closed reduction first.</text>
<rect x="598.7" y="713.2" width="277.3" height="99.6" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.8" />
<rect x="607.7" y="721.2" width="131.9" height="23.0" rx="11.5" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="616.7" y="738.2" font-size="13" fill="#ffffff" font-weight="bold">EVERY PATIENT</text>
<text x="607.7" y="765.2" font-size="13" fill="#241a18">Fascia iliaca or femoral block on arrival,</text>
<text x="607.7" y="782.4" font-size="13" fill="#241a18">and again before positioning for the spinal.</text>
<text x="607.7" y="799.6" font-size="13" fill="#241a18">Surgery within 36 h.</text>
</svg>
