- file: shoulder-three-operations.svg
  caption: "Anatomic replacement, reverse replacement and cuff repair side by side. Look at what each leaves under tension: a subscapularis repair, a lengthened arm on a stretched deltoid, or a tendon held on bone. That, not the size of the operation, sets the tail of the pain curve."
  alt: "Three-panel schematic of the shoulder. Anatomic total shoulder: metal head, polyethylene glenoid liner, subscapularis repaired; tag bone, score 4. Reverse total shoulder: glenosphere on the glenoid, arm 2-3 cm longer, deltoid stretched; tag retension, score 4. Arthroscopic cuff repair: tendon pulled to an anchor in the footprint; tag tendon-tension, score 5. Each panel lists what is cut, what is under tension, the day 0 to 7 pain trajectory and the block plan."
  targets: [anatomic-tsa, reverse-tsa, rotator-cuff-repair, b01-why-operations-hurt]
- file: pain-curves.svg
  caption: "The two archetype trajectories. Both peak as the single-shot block recedes on day 1, with rebound on top; bone then falls fast, while a tendon under tension plateaus for one to two weeks. The catheter question is about the shaded tail."
  alt: "Line chart of expected worst pain, 0 to 10, from day 0 to day 7. A green band marks the single-shot block working for 10 to 16 hours, or 20 to 24 hours with dexamethasone. Curve A, bone, peaks near 5 to 6 on day 1 and falls to about 2 by day 3. Curve B, tendon under tension, shares the peak and stays near 5 to day 3, falling to about 3.5 by day 7. A dashed spike marks rebound pain as the block recedes."
  targets: [b01-why-operations-hurt]
- file: mechanism-to-plan.svg
  caption: "From the dominant mechanism tag on a card to the block and catheter plan. Follow one column down, then modify for the patient and for what the unit can deliver."
  alt: "Flow diagram. Five mechanism tags (surface, bone, tendon-tension, retension, nerve or visceral) each lead to a pain shape, a plan and a catheter verdict: none for surface, selective for bone, strongest claim for tendon-tension, by patient and unit for retension, and specific multimodal measures for nerve or visceral. All converge on a box about modifying for the patient and logistics, with two cautions about the evidence for catheters."
  targets: [b01-why-operations-hurt, a07-block-menu]
- file: beach-chair-hydrostatics.svg
  caption: "In the beach chair the brain sits 20-30 cm above an arm cuff, so it sees 15 to 23 mmHg less than the displayed mean. A calf cuff errs the other way and reads 45-60 mmHg high."
  alt: "Schematic of a seated patient with dashed lines at the external auditory meatus, the arm cuff at heart level and a calf cuff. The meatus is 20-30 cm above the arm cuff at 0.77 mmHg per cm; the calf is 60-80 cm below. Boxes state that a displayed mean of 65 is the mid-40s at the brain, that the target is a displayed mean of about 80 or more, that an arterial transducer should be levelled at the meatus, and that a calf reading of 90 may be a brain pressure of 30."
  targets: [a06-positioning, anatomic-tsa, rotator-cuff-repair, reverse-tsa]
- file: shoulder-block-map.svg
  caption: "What each shoulder block covers, misses and costs. Interscalene covers the joint and the cape but takes the phrenic nerve; superior trunk keeps the analgesia with far less complete paresis; suprascapular plus axillary spares the phrenic and misses the anterior capsule. No block covers T2."
  alt: "Table diagram. Rows: interscalene, superior trunk, suprascapular plus axillary, and supraclavicular or infraclavicular plus suprascapular. Columns: joint C5-6, cape skin C3-4, posterior portal and axilla T2, phrenic paresis, and when to use it. Interscalene: paresis 98 percent, complete in 73 percent. Superior trunk: 76 percent, complete in 5 percent, cape skin missed. Suprascapular plus axillary: no phrenic block, anterior capsule missed. Notes cover clavicle surgery needing C3-4 and testing axillary nerve function after fracture."
  targets: [a07-block-menu, shoulder-stabilisation, acj-reconstruction-clavicle]
- file: upper-limb-block-map.svg
  caption: "How far down the arm each technique reaches, from supraclavicular block to wide-awake local infiltration. No plexus block covers the medial arm skin under an upper arm tourniquet."
  alt: "Schematic of the arm from shoulder to hand with a tourniquet cuff on the upper arm and the T2 medial arm skin marked. Bars show coverage: supraclavicular from the upper arm to the hand with a T2 gap, infraclavicular from mid-humerus, axillary from the elbow with a separate musculocutaneous injection, forearm blocks for the hand, and wide-awake local with adrenaline at the operative site with no tourniquet. A table lists the defensible default for distal radius fixation, carpal tunnel, Dupuytren's, tendon repair and elbow surgery."
  targets: [a07-block-menu, distal-radius-orif, hand-trauma]
- file: knee-block-map.svg
  caption: "Front of the knee, back of the knee and the motor price of each block. The adductor canal block keeps the quadriceps but misses the posterior capsule; infiltration or IPACK covers it without the foot drop of a sciatic block."
  alt: "Two knee schematics naming the nerves to the front (saphenous, nerves to the vasti, anterior obturator), the lateral side (genicular branches of the common peroneal) and the back (tibial and posterior obturator). A table then gives, for adductor canal block, surgeon infiltration, IPACK, femoral and sciatic blocks, whether the front and back of the knee are covered, the motor cost and the place in the plan. Femoral leaves quadriceps at 18 percent of baseline against 52 percent with adductor canal; sciatic causes foot drop."
  targets: [a07-block-menu, primary-tka, acl-reconstruction]
- file: hip-block-map.svg
  caption: "What each hip technique covers of the anterior capsule, the posterior capsule and the skin, and what it costs in weakness. For primary hip replacement the default is a spinal with surgeon infiltration and no motor-blocking block."
  alt: "Schematic of the hip capsule split into front and back halves with the skin of the incision, naming the nerves to each. A table gives, for spinal, surgeon infiltration, PENG, suprainguinal fascia iliaca, femoral and lateral femoral cutaneous blocks, the cover of anterior capsule, posterior capsule and skin, the motor cost and the place in the plan. PENG is motor-sparing in principle; fascia iliaca and femoral blocks weaken the quadriceps; no peripheral block covers the posterior capsule."
  targets: [a07-block-menu, tha-posterior, neck-of-femur]
- file: tka-steps-timeline.svg
  caption: "A primary knee replacement as a timeline, with the anaesthetic event pinned to each surgical step and the tourniquet options drawn above. The antibiotic goes in before the cuff, the femoral rod is the embolic step, and deflation and the local anaesthetic dose arrive together at the end."
  alt: "Two-row timeline of ten steps: before the table, position and cuff decision, arthrotomy, medial release, bone cuts, soft-tissue balancing, patella, cement and implants, infiltration with closure and cuff down, and recovery. Each step has the surgeon's action and a box with the anaesthetic consequence. Bars show a whole-case tourniquet from step 2 to step 9, with tourniquet pain at 60-90 minutes, and a cement-only tourniquet of under 30 minutes. A footer summarises the randomised evidence against routine tourniquet use."
  targets: [primary-tka]
- file: tha-approaches.svg
  caption: "Three ways into a hip. Each arrow shows which muscles the approach passes between or through and which nerve lies in its path; the boxes give the position on the table and the price of each."
  alt: "Schematic section through the hip with the femoral head, pelvis, sartorius, tensor fasciae latae, rectus femoris, gluteus medius, short rotators and gluteus maximus. Arrow A, direct anterior, passes between tensor fasciae latae and sartorius near the lateral femoral cutaneous nerve, supine. Arrow L, direct lateral, passes through gluteus medius near the superior gluteal nerve. Arrow P, posterior, passes through gluteus maximus and the short rotators beside the sciatic nerve, in lateral decubitus."
  targets: [tha-posterior, tha-anterior-lateral]
- file: hip-fracture-map.svg
  caption: "Where the fracture lies decides the operation. Inside the capsule the head is replaced (cemented hemiarthroplasty or total hip) unless undisplaced; outside it the fracture is fixed with a dynamic hip screw or a nail on a traction table."
  alt: "Schematic proximal femur with the capsule and three fracture lines: through the neck inside the capsule, intertrochanteric and subtrochanteric. Intracapsular fractures lead to cannulated screws if undisplaced, cemented hemiarthroplasty for most displaced fractures, or total hip arthroplasty in the fit and independent, flagged cement and lateral position. Extracapsular fractures lead to a dynamic hip screw or a cephalomedullary nail, flagged traction table and no cement."
  targets: [neck-of-femur]
- file: bcis-timeline.svg
  caption: "Cementing a femoral stem, point by point: what the surgeon does, what the circulation does and what the anaesthetist does. The embolic load starts with the cement, is worst after the stem and returns at reduction."
  alt: "Timeline with five columns: before the list, canal preparation, cement in and pressurised, stem insertion, and reduction and after. A schematic curve shows the embolic load rising with cement, peaking after stem insertion and rising again at reduction. Rows give surgeon, physiology and anaesthetist actions. A box gives the treatment of an event as acute right heart failure, and a table defines grades 1 to 3 with incidence of 21, 5.1 and 1.7 percent and early mortality of 9.3, 35 and 88 percent."
  targets: [a02-cement-bcis, neck-of-femur, tha-posterior]
- file: tourniquet-timeline.svg
  caption: "The tourniquet clock. Above, the inflation: pain and hypertension from 30 minutes, the time called at 60 and 90, the cuff down by 120 and a ceiling of 180. Below, what arrives after deflation and for how long."
  alt: "Two-part diagram. Part A is an axis from 0 to 180 minutes of inflation with tourniquet pain from 30-45 minutes, hypertension under general anaesthesia, time calls at 60 and 90 minutes, cuff down at or before 120 and a ceiling of 180 minutes total. Part B is a chart of events after deflation: embolic shower in the first 30 seconds, falling pressure to 15 minutes, end-tidal CO2 peak at 1 minute, acidosis with lactate and potassium at 2-4 minutes, cerebral blood flow up 50 percent, temperature dip, a hypocoagulable state to 30 minutes and return of sequestered drug at 30-60 minutes."
  targets: [a01-tourniquet]
- file: prone-pressure-points.svg
  caption: "The prone checklist from head to toe: eyes, airway, arms, chest support, a free abdomen, iliac crests, knees and feet, and head height. The lower panel is the anaesthetic that permits neuromonitoring."
  alt: "Side-view schematic of a prone patient on a frame with supports under the chest and iliac crests, the abdomen hanging free, arms forward on a board and numbered markers 1 to 8. Eight boxes explain each point: eyes and face, airway, arms and brachial plexus, chest support, abdomen free, iliac crests, knees and feet, head height and vision. A panel lists the neuromonitoring anaesthetic: propofol and remifentanil, one dose of relaxant, bite blocks, steady state, stable physiology and raising mean pressure above 80-90 mmHg for a signal change."
  targets: [a14-spine-essentials, a06-positioning, posterior-lumbar-fusion]
