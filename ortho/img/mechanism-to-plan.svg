<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="900" height="710" fill="#ffffff"/>
<defs><marker id="a-maroon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#4e1d24"/></marker><marker id="s-maroon" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#4e1d24"/></marker><marker id="a-sand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#d98b3c"/></marker><marker id="s-sand" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#d98b3c"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#8a7b74"/></marker><marker id="s-grey" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#8a7b74"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#b02e2e"/></marker><marker id="s-danger" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#b02e2e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#241a18"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#241a18"/></marker></defs>
<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">From dominant mechanism to block and catheter plan</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Read the tag on the card, then follow the column down. The patient and the logistics modify the plan, not the score.</text>
<rect x="300.0" y="84.0" width="300.0" height="38.0" rx="8" fill="#4e1d24" stroke="#4e1d24" stroke-width="1" />
<text x="450.0" y="108.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Dominant mechanism on the card</text>
<line x1="450.0" y1="122.0" x2="450.0" y2="140.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="106.0" y1="140.0" x2="794.0" y2="140.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="106.0" y1="140.0" x2="106.0" y2="158.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="24.0" y="162.0" width="164.0" height="34.0" rx="17" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="106.0" y="184.0" font-size="14" fill="#4e1d24" text-anchor="middle" font-weight="bold">surface</text>
<text x="106.0" y="216.0" font-size="13" fill="#8a7b74" text-anchor="middle">portals and irrigation</text>
<text x="106.0" y="233.2" font-size="13" fill="#8a7b74" text-anchor="middle">only</text>
<rect x="24.0" y="269.6" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#8a7b74" stroke-width="1.2" />
<text x="106.0" y="289.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">Pain for hours</text>
<line x1="106.0" y1="299.6" x2="106.0" y2="315.6" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="24.0" y="319.6" width="164.0" height="123.2" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="33.0" y="341.6" font-size="13" fill="#241a18">No block, or a block as</text>
<text x="33.0" y="358.8" font-size="13" fill="#241a18">the anaesthetic only.</text>
<rect x="24.0" y="450.8" width="164.0" height="44.0" rx="4" fill="#ffffff" stroke="#d98b3c" stroke-width="1.5" />
<text x="106.0" y="477.8" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">Catheter: no</text>
<line x1="106.0" y1="494.8" x2="106.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="278.0" y1="140.0" x2="278.0" y2="158.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="196.0" y="162.0" width="164.0" height="34.0" rx="17" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="278.0" y="184.0" font-size="14" fill="#4e1d24" text-anchor="middle" font-weight="bold">bone</text>
<text x="278.0" y="216.0" font-size="13" fill="#8a7b74" text-anchor="middle">osteotomy, reaming,</text>
<text x="278.0" y="233.2" font-size="13" fill="#8a7b74" text-anchor="middle">drilling, cement</text>
<rect x="196.0" y="269.6" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#8a7b74" stroke-width="1.2" />
<text x="278.0" y="289.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">Peaks day 1-2, falls fast</text>
<line x1="278.0" y1="299.6" x2="278.0" y2="315.6" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="196.0" y="319.6" width="164.0" height="123.2" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="205.0" y="341.6" font-size="13" fill="#241a18">Single-shot block with</text>
<text x="205.0" y="358.8" font-size="13" fill="#241a18">IV dexamethasone. Oral</text>
<text x="205.0" y="376.0" font-size="13" fill="#241a18">regimen started before</text>
<text x="205.0" y="393.2" font-size="13" fill="#241a18">it recedes. Rebound</text>
<text x="205.0" y="410.4" font-size="13" fill="#241a18">plan for the first night.</text>
<rect x="196.0" y="450.8" width="164.0" height="44.0" rx="4" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="278.0" y="477.8" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">Catheter: selective</text>
<line x1="278.0" y1="494.8" x2="278.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="450.0" y1="140.0" x2="450.0" y2="158.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="368.0" y="162.0" width="164.0" height="34.0" rx="17" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="450.0" y="184.0" font-size="14" fill="#4e1d24" text-anchor="middle" font-weight="bold">tendon-tension</text>
<text x="450.0" y="216.0" font-size="13" fill="#8a7b74" text-anchor="middle">tendon or graft fixed</text>
<text x="450.0" y="233.2" font-size="13" fill="#8a7b74" text-anchor="middle">under tension</text>
<rect x="368.0" y="269.6" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#8a7b74" stroke-width="1.2" />
<text x="450.0" y="289.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">Plateau for 1-2 weeks</text>
<line x1="450.0" y1="299.6" x2="450.0" y2="315.6" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="368.0" y="319.6" width="164.0" height="123.2" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="377.0" y="341.6" font-size="13" fill="#241a18">Catheter has its</text>
<text x="377.0" y="358.8" font-size="13" fill="#241a18">strongest claim. If not,</text>
<text x="377.0" y="376.0" font-size="13" fill="#241a18">a single shot with</text>
<text x="377.0" y="393.2" font-size="13" fill="#241a18">dexamethasone and a</text>
<text x="377.0" y="410.4" font-size="13" fill="#241a18">written plan for the</text>
<text x="377.0" y="427.6" font-size="13" fill="#241a18">week.</text>
<rect x="368.0" y="450.8" width="164.0" height="44.0" rx="4" fill="#d98b3c" stroke="#d98b3c" stroke-width="1.5" />
<text x="450.0" y="468.8" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">Catheter: strongest</text>
<text x="450.0" y="486.0" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">claim</text>
<line x1="450.0" y1="494.8" x2="450.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="622.0" y1="140.0" x2="622.0" y2="158.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="540.0" y="162.0" width="164.0" height="34.0" rx="17" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="622.0" y="184.0" font-size="14" fill="#4e1d24" text-anchor="middle" font-weight="bold">retension</text>
<text x="622.0" y="216.0" font-size="13" fill="#8a7b74" text-anchor="middle">joint re-tensioned or</text>
<text x="622.0" y="233.2" font-size="13" fill="#8a7b74" text-anchor="middle">limb lengthened</text>
<rect x="540.0" y="269.6" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#8a7b74" stroke-width="1.2" />
<text x="622.0" y="289.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">Aches for weeks</text>
<line x1="622.0" y1="299.6" x2="622.0" y2="315.6" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="540.0" y="319.6" width="164.0" height="123.2" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="549.0" y="341.6" font-size="13" fill="#241a18">Single shot or catheter,</text>
<text x="549.0" y="358.8" font-size="13" fill="#241a18">by patient and unit.</text>
<text x="549.0" y="376.0" font-size="13" fill="#241a18">Rebound is the start of</text>
<text x="549.0" y="393.2" font-size="13" fill="#241a18">a tail that lasts weeks.</text>
<rect x="540.0" y="450.8" width="164.0" height="44.0" rx="4" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="622.0" y="468.8" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">Catheter: by patient</text>
<text x="622.0" y="486.0" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">and unit</text>
<line x1="622.0" y1="494.8" x2="622.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="794.0" y1="140.0" x2="794.0" y2="158.0" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="712.0" y="162.0" width="164.0" height="34.0" rx="17" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="794.0" y="184.0" font-size="14" fill="#4e1d24" text-anchor="middle" font-weight="bold">nerve / visceral</text>
<text x="794.0" y="216.0" font-size="13" fill="#8a7b74" text-anchor="middle">nerve handled, or an</text>
<text x="794.0" y="233.2" font-size="13" fill="#8a7b74" text-anchor="middle">anterior approach to</text>
<text x="794.0" y="250.4" font-size="13" fill="#8a7b74" text-anchor="middle">spine or pelvis</text>
<rect x="712.0" y="269.6" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#8a7b74" stroke-width="1.2" />
<text x="794.0" y="289.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">Unpredictable</text>
<line x1="794.0" y1="299.6" x2="794.0" y2="315.6" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="712.0" y="319.6" width="164.0" height="123.2" rx="6" fill="#faf6ef" stroke="#4e1d24" stroke-width="1.5" />
<text x="721.0" y="341.6" font-size="13" fill="#241a18">Multimodal plus the</text>
<text x="721.0" y="358.8" font-size="13" fill="#241a18">specific measures:</text>
<text x="721.0" y="376.0" font-size="13" fill="#241a18">anti-neuropathic agents;</text>
<text x="721.0" y="393.2" font-size="13" fill="#241a18">epidural or erector</text>
<text x="721.0" y="410.4" font-size="13" fill="#241a18">spinae block for spine.</text>
<rect x="712.0" y="450.8" width="164.0" height="44.0" rx="4" fill="#ffffff" stroke="#d98b3c" stroke-width="1.5" />
<text x="794.0" y="468.8" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">Catheter: not the main</text>
<text x="794.0" y="486.0" font-size="13" fill="#241a18" text-anchor="middle" font-weight="bold">tool</text>
<line x1="794.0" y1="494.8" x2="794.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="106.0" y1="512.8" x2="794.0" y2="512.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="450.0" y1="512.8" x2="450.0" y2="528.8" stroke="#4e1d24" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<rect x="120.0" y="532.8" width="660.0" height="74.6" rx="6" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.8" />
<text x="450.0" y="554.8" font-size="13" fill="#4e1d24" text-anchor="middle" font-weight="bold">Modify for the patient and the logistics</text>
<text x="450.0" y="575.0" font-size="13" fill="#241a18" text-anchor="middle">Opioid-tolerant, catastrophising, a previous bad night after a block; a day case with no one at home; a unit</text>
<text x="450.0" y="592.2" font-size="13" fill="#241a18" text-anchor="middle">that cannot run a catheter or give a 2 am dose.</text>
<rect x="24.0" y="621.4" width="852.0" height="74.6" rx="6" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="33.0" y="643.4" font-size="13" fill="#4e1d24" font-weight="bold">Two cautions</text>
<text x="33.0" y="663.6" font-size="13" fill="#241a18">Most trials measured rest pain over the first 48 hours, the window where a dexamethasone-prolonged single shot and a catheter look</text>
<text x="33.0" y="680.8" font-size="13" fill="#241a18">alike. A catheter that falls out, leaks or is never topped up is a single shot with extra steps.</text>
</svg>
