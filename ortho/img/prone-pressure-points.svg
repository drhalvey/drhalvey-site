<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Prone on a frame: the checklist from head to toe</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Supports belong on the chest and the iliac crests so the abdomen hangs free. General anaesthesia removes every warning the patient would</text>
<text x="24.0" y="75.2" font-size="13" fill="#8a7b74">have given.</text>
<rect x="228.0" y="244.4" width="620.0" height="14.0" rx="4" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="70.0" y="202.4" width="92.0" height="20.0" rx="6" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="108.0" y="222.4" width="14.0" height="68.0" rx="2" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="44.0" y="282.4" width="176.0" height="10.0" rx="3" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="240.0" y="200.4" width="96.0" height="44.0" rx="8" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="452.0" y="200.4" width="84.0" height="44.0" rx="8" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="606.0" y="214.4" width="60.0" height="30.0" rx="8" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
<rect x="742.0" y="204.4" width="70.0" height="40.0" rx="8" fill="#d5cfcb" stroke="#8a7b74" stroke-width="1.5" />
