<text x="776.0" y="252.0" font-size="13" fill="#241a18">anchor in</text>
<text x="776.0" y="269.2" font-size="13" fill="#241a18">decorticated</text>
<text x="776.0" y="286.4" font-size="13" fill="#241a18">bone</text>
<text x="34.0" y="380.0" font-size="13" fill="#d98b3c" font-weight="bold">WHAT IS CUT</text>
<text x="34.0" y="399.0" font-size="13" fill="#241a18">Subscapularis taken down; humeral head</text>
<text x="34.0" y="416.2" font-size="13" fill="#241a18">osteotomy; glenoid reamed.</text>
<text x="324.0" y="380.0" font-size="13" fill="#d98b3c" font-weight="bold">WHAT IS CUT</text>
<text x="324.0" y="399.0" font-size="13" fill="#241a18">Humeral head osteotomy; glenoid</text>
<text x="324.0" y="416.2" font-size="13" fill="#241a18">reamed; baseplate screwed to the</text>
<text x="324.0" y="433.4" font-size="13" fill="#241a18">scapula; canal prepared.</text>
<text x="614.0" y="380.0" font-size="13" fill="#d98b3c" font-weight="bold">WHAT IS CUT</text>
<text x="614.0" y="399.0" font-size="13" fill="#241a18">Bursa stripped, acromion shaved,</text>
<text x="614.0" y="416.2" font-size="13" fill="#241a18">footprint decorticated, anchors drilled.</text>
<text x="614.0" y="433.4" font-size="13" fill="#241a18">Portals only at the skin.</text>
<text x="34.0" y="458.6" font-size="13" fill="#d98b3c" font-weight="bold">LEFT UNDER TENSION</text>
<text x="34.0" y="477.6" font-size="13" fill="#241a18">Only the subscapularis repair. Cuff and</text>
<text x="34.0" y="494.8" font-size="13" fill="#241a18">capsule stay at their native length.</text>
<text x="324.0" y="458.6" font-size="13" fill="#d98b3c" font-weight="bold">LEFT UNDER TENSION</text>
<text x="324.0" y="477.6" font-size="13" fill="#241a18">Arm lengthened so the deltoid lifts</text>
<text x="324.0" y="494.8" font-size="13" fill="#241a18">without a cuff. Deltoid, capsule, axillary</text>
<text x="324.0" y="512.0" font-size="13" fill="#241a18">nerve and plexus are stretched.</text>
<text x="614.0" y="458.6" font-size="13" fill="#d98b3c" font-weight="bold">LEFT UNDER TENSION</text>
<text x="614.0" y="477.6" font-size="13" fill="#241a18">A retracted tendon held on bone and</text>
<text x="614.0" y="494.8" font-size="13" fill="#241a18">loaded by every movement for weeks.</text>
<text x="34.0" y="537.2" font-size="13" fill="#d98b3c" font-weight="bold">PAIN MECHANISM AND SCORE</text>
