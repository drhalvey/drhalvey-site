<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Three shoulder operations: what is cut and what is left under tension</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">The surgeon decides the tissue and the tension. The tension, not the size of the operation, sets the shape of the pain curve.</text>
