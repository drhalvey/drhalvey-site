<text x="34.0" y="697.2" font-size="13" fill="#d98b3c" font-weight="bold">PLAN</text>
<text x="34.0" y="716.2" font-size="13" fill="#241a18">Interscalene single shot with IV</text>
<text x="34.0" y="733.4" font-size="13" fill="#241a18">dexamethasone. Catheter selective. Hurts</text>
<text x="34.0" y="750.6" font-size="13" fill="#241a18">hard on days 1-2, then settles.</text>
