<text x="106.0" y="165.0" font-size="13" fill="#241a18" font-weight="bold">block working</text>
<text x="106.0" y="184.0" font-size="13" fill="#241a18">10-16 h, or</text>
<text x="106.0" y="201.0" font-size="13" fill="#241a18">20-24 h with</text>
<text x="106.0" y="218.0" font-size="13" fill="#241a18">dexamethasone</text>
