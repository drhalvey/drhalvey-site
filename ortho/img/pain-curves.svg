<text x="287.2" y="150.8" font-size="13" fill="#b02e2e">Rebound as the block recedes: for a few hours worse than no block at all.</text>
<text x="287.2" y="168.0" font-size="13" fill="#b02e2e">Half of ambulatory block patients; more after bone surgery, in women and the</text>
<text x="287.2" y="185.2" font-size="13" fill="#b02e2e">young; less with IV dexamethasone.</text>
<text x="838.0" y="407.0" font-size="16" fill="#4e1d24" font-weight="bold">A</text>
<text x="838.0" y="343.0" font-size="16" fill="#d98b3c" font-weight="bold">B</text>
<text x="578.4" y="355.6" font-size="13" fill="#241a18" text-anchor="middle" font-style="italic">the tail: the catheter question lives here</text>
<text x="360.0" y="238.8" font-size="13" fill="#241a18" font-weight="bold">B Tendon under tension (cuff repair, quadriceps tendon repair): same</text>
<text x="360.0" y="256.0" font-size="13" fill="#241a18" font-weight="bold">peak, then a plateau for one to two weeks.</text>
<text x="443.2" y="420.0" font-size="13" fill="#4e1d24" font-weight="bold">A Bone (hip replacement, distal radius plate,</text>
<text x="443.2" y="437.2" font-size="13" fill="#4e1d24" font-weight="bold">hemiarthroplasty): falls fast once nothing is loaded through it.</text>
<rect x="24.0" y="520.0" width="418.0" height="91.8" rx="6" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="33.0" y="542.0" font-size="13" fill="#4e1d24" font-weight="bold">Day 1-2 peak: the same problem for both curves</text>
<text x="33.0" y="562.2" font-size="13" fill="#241a18">This is where the single shot ends, for every card with a bone</text>
<text x="33.0" y="579.4" font-size="13" fill="#241a18">tag. Give IV dexamethasone, start the oral regimen in recovery</text>
<text x="33.0" y="596.6" font-size="13" fill="#241a18">before the block recedes, and tell the patient the hour it will fade.</text>
<rect x="458.0" y="520.0" width="418.0" height="91.8" rx="6" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="467.0" y="542.0" font-size="13" fill="#4e1d24" font-weight="bold">After day 2: the curves separate</text>
<text x="467.0" y="562.2" font-size="13" fill="#241a18">A catheter that comes out on day 2 has done its job for a bone</text>
<text x="467.0" y="579.4" font-size="13" fill="#241a18">operation and has barely started for a tendon repair. For a tendon</text>
<text x="467.0" y="596.6" font-size="13" fill="#241a18">or retension tag, the rebound is the start of the plateau.</text>
</svg>
