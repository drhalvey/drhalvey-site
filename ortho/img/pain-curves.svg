<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Two pain trajectories: bone, and tendon under tension</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Schematic archetypes of expected worst pain with a single-shot block and the recommended plan in place. The peak is shared; the tail</text>
<text x="24.0" y="75.2" font-size="13" fill="#8a7b74">decides the catheter question.</text>
<rect x="100.0" y="130.0" width="99.8" height="320.0" rx="0" fill="#9bbf8a" stroke="none" stroke-width="0" fill-opacity="0.5" />
