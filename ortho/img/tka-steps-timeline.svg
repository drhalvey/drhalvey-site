<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 928" width="900" height="928" font-family="Helvetica, Arial, sans-serif" role="img">
<rect x="0" y="0" width="900" height="928" fill="#ffffff"/>
<defs><marker id="a-maroon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#4e1d24"/></marker><marker id="s-maroon" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#4e1d24"/></marker><marker id="a-sand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#d98b3c"/></marker><marker id="s-sand" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#d98b3c"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#8a7b74"/></marker><marker id="s-grey" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#8a7b74"/></marker><marker id="a-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#b02e2e"/></marker><marker id="s-danger" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#b02e2e"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#241a18"/></marker><marker id="s-ink" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0.8 L1,5 L10,9.2 Z" fill="#241a18"/></marker></defs>
<text x="24.0" y="36.0" font-size="20" fill="#4e1d24" font-weight="bold">Primary total knee arthroplasty: the anaesthetic events, step by step</text>
<text x="24.0" y="58.0" font-size="13" fill="#8a7b74">Read left to right, top row then bottom row. Grey text is what the surgeon is doing; the sand boxes are what it means for you.</text>
<text x="24.0" y="104.2" font-size="13" fill="#4e1d24" font-weight="bold">Tourniquet, whole case</text>
<rect x="257.0" y="113.2" width="619.0" height="18.0" rx="4" fill="#d98b3c" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="265.0" y="127.2" font-size="13" fill="#241a18">cuff up after the antibiotic</text>
<text x="868.0" y="127.2" font-size="13" fill="#241a18" text-anchor="end" font-style="italic">continues</text>
<line x1="24.0" y1="159.2" x2="876.0" y2="159.2" stroke="#4e1d24" stroke-width="2.2" stroke-linecap="round"/>
<line x1="876.0" y1="159.2" x2="876.0" y2="163.2" stroke="#4e1d24" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="40.0" cy="159.2" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="40.0" y="164.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
<text x="24.0" y="195.2" font-size="13" fill="#4e1d24" font-weight="bold">Before the table</text>
<text x="24.0" y="231.6" font-size="13" fill="#8a7b74">Decisions made before</text>
<text x="24.0" y="248.8" font-size="13" fill="#8a7b74">the patient arrives.</text>
<rect x="24.0" y="294.4" width="160.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="32.0" y="313.4" font-size="13" fill="#241a18">Spinal with sedation,</text>
<text x="32.0" y="330.6" font-size="13" fill="#241a18">adductor canal block,</text>
<text x="32.0" y="347.8" font-size="13" fill="#241a18">dexamethasone 10 mg</text>
<text x="32.0" y="365.0" font-size="13" fill="#241a18">IV, tranexamic acid 1 g</text>
<text x="32.0" y="382.2" font-size="13" fill="#241a18">IV before incision.</text>
<circle cx="213.0" cy="159.2" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="213.0" y="164.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
<text x="197.0" y="195.2" font-size="13" fill="#4e1d24" font-weight="bold">Position and cuff</text>
<text x="197.0" y="212.4" font-size="13" fill="#4e1d24" font-weight="bold">decision</text>
<text x="197.0" y="231.6" font-size="13" fill="#8a7b74">Knee flexed past 90</text>
<text x="197.0" y="248.8" font-size="13" fill="#8a7b74">degrees against a post;</text>
<text x="197.0" y="266.0" font-size="13" fill="#8a7b74">thigh cuff if one is used.</text>
<rect x="197.0" y="294.4" width="160.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="205.0" y="313.4" font-size="13" fill="#241a18">Cefazolin 2 g complete</text>
<text x="205.0" y="330.6" font-size="13" fill="#241a18">before the cuff inflates:</text>
<text x="205.0" y="347.8" font-size="13" fill="#241a18">nothing given later</text>
<text x="205.0" y="365.0" font-size="13" fill="#241a18">reaches the leg.</text>
<circle cx="386.0" cy="159.2" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="386.0" y="164.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="370.0" y="195.2" font-size="13" fill="#4e1d24" font-weight="bold">Arthrotomy, patella</text>
<text x="370.0" y="212.4" font-size="13" fill="#4e1d24" font-weight="bold">everted</text>
<text x="370.0" y="231.6" font-size="13" fill="#8a7b74">Medial parapatellar,</text>
<text x="370.0" y="248.8" font-size="13" fill="#8a7b74">through the quadriceps</text>
<text x="370.0" y="266.0" font-size="13" fill="#8a7b74">tendon.</text>
<rect x="370.0" y="294.4" width="160.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="378.0" y="313.4" font-size="13" fill="#241a18">First real nociception</text>
<text x="378.0" y="330.6" font-size="13" fill="#241a18">and the first test of a</text>
<text x="378.0" y="347.8" font-size="13" fill="#241a18">borderline spinal. Full</text>
<text x="378.0" y="365.0" font-size="13" fill="#241a18">quadriceps relaxation</text>
<text x="378.0" y="382.2" font-size="13" fill="#241a18">wanted.</text>
<circle cx="559.0" cy="159.2" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="559.0" y="164.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
<text x="543.0" y="195.2" font-size="13" fill="#4e1d24" font-weight="bold">Osteophytes and medial</text>
<text x="543.0" y="212.4" font-size="13" fill="#4e1d24" font-weight="bold">release</text>
<text x="543.0" y="231.6" font-size="13" fill="#8a7b74">Medial sleeve lifted</text>
<text x="543.0" y="248.8" font-size="13" fill="#8a7b74">subperiosteally; tibia</text>
<text x="543.0" y="266.0" font-size="13" fill="#8a7b74">levered forward.</text>
<rect x="543.0" y="294.4" width="160.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="551.0" y="313.4" font-size="13" fill="#241a18">Periosteal pain,</text>
<text x="551.0" y="330.6" font-size="13" fill="#241a18">proportional to the</text>
<text x="551.0" y="347.8" font-size="13" fill="#241a18">deformity. The lever</text>
<text x="551.0" y="365.0" font-size="13" fill="#241a18">sits on the popliteal</text>
<text x="551.0" y="382.2" font-size="13" fill="#241a18">vessels and tibial</text>
<text x="551.0" y="399.4" font-size="13" fill="#241a18">nerve.</text>
<circle cx="732.0" cy="159.2" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="732.0" y="164.2" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<text x="716.0" y="195.2" font-size="13" fill="#4e1d24" font-weight="bold">Bone cuts</text>
<text x="716.0" y="231.6" font-size="13" fill="#8a7b74">Five femoral cuts and</text>
<text x="716.0" y="248.8" font-size="13" fill="#8a7b74">one tibial; rod up the</text>
<text x="716.0" y="266.0" font-size="13" fill="#8a7b74">femoral canal, or pinned</text>
<text x="716.0" y="283.2" font-size="13" fill="#8a7b74">trackers.</text>
<rect x="716.0" y="294.4" width="160.0" height="121.2" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="724.0" y="313.4" font-size="13" fill="#241a18">The intramedullary rod</text>
<text x="724.0" y="330.6" font-size="13" fill="#241a18">is the fat embolism</text>
<text x="724.0" y="347.8" font-size="13" fill="#241a18">step: a dip in end-tidal</text>
<text x="724.0" y="365.0" font-size="13" fill="#241a18">CO2 and saturation is</text>
<text x="724.0" y="382.2" font-size="13" fill="#241a18">the signature.</text>
<text x="24.0" y="446.6" font-size="13" fill="#4e1d24" font-weight="bold">Tourniquet, whole case</text>
<rect x="24.0" y="455.6" width="659.0" height="18.0" rx="4" fill="#d98b3c" stroke="#4e1d24" stroke-width="1.5" fill-opacity="0.85" />
<text x="32.0" y="469.6" font-size="13" fill="#241a18">at 60-90 min: rising pressure and a restless patient is tourniquet pain through a working spinal</text>
<text x="693.0" y="469.6" font-size="13" fill="#4e1d24" font-weight="bold">cuff down</text>
<text x="370.0" y="494.6" font-size="13" fill="#4e1d24" font-weight="bold">Cement only</text>
<rect x="456.0" y="481.6" width="227.0" height="18.0" rx="4" fill="#ffffff" stroke="#4e1d24" stroke-width="1.5" stroke-dasharray="6 3" />
<text x="464.0" y="495.6" font-size="13" fill="#241a18">under 30 min, most of the benefit</text>
<line x1="24.0" y1="529.6" x2="876.0" y2="529.6" stroke="#4e1d24" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a-maroon)"/>
<circle cx="40.0" cy="529.6" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="40.0" y="534.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<text x="24.0" y="565.6" font-size="13" fill="#4e1d24" font-weight="bold">Soft-tissue balancing</text>
<text x="24.0" y="602.0" font-size="13" fill="#8a7b74">Gaps equalised by</text>
<text x="24.0" y="619.2" font-size="13" fill="#8a7b74">releases and insert</text>
<text x="24.0" y="636.4" font-size="13" fill="#8a7b74">thickness.</text>
<rect x="24.0" y="664.8" width="160.0" height="138.4" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="32.0" y="683.8" font-size="13" fill="#241a18">The retension</text>
<text x="32.0" y="701.0" font-size="13" fill="#241a18">mechanism is created</text>
<text x="32.0" y="718.2" font-size="13" fill="#241a18">here: the deep, stiff</text>
<text x="32.0" y="735.4" font-size="13" fill="#241a18">ache of days 1 and 2</text>
<text x="32.0" y="752.6" font-size="13" fill="#241a18">that the block only</text>
<text x="32.0" y="769.8" font-size="13" fill="#241a18">partly reaches.</text>
<circle cx="213.0" cy="529.6" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="213.0" y="534.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text>
<text x="197.0" y="565.6" font-size="13" fill="#4e1d24" font-weight="bold">Patella and lateral</text>
<text x="197.0" y="582.8" font-size="13" fill="#4e1d24" font-weight="bold">release</text>
<text x="197.0" y="602.0" font-size="13" fill="#8a7b74">Resurfaced or left;</text>
<text x="197.0" y="619.2" font-size="13" fill="#8a7b74">lateral retinaculum</text>
<text x="197.0" y="636.4" font-size="13" fill="#8a7b74">released if it tracks</text>
<text x="197.0" y="653.6" font-size="13" fill="#8a7b74">laterally.</text>
<rect x="197.0" y="664.8" width="160.0" height="138.4" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="205.0" y="683.8" font-size="13" fill="#241a18">A raw capsular edge</text>
<text x="205.0" y="701.0" font-size="13" fill="#241a18">that bleeds once the</text>
<text x="205.0" y="718.2" font-size="13" fill="#241a18">cuff is down: the usual</text>
<text x="205.0" y="735.4" font-size="13" fill="#241a18">cause of a large</text>
<text x="205.0" y="752.6" font-size="13" fill="#241a18">haemarthrosis.</text>
<circle cx="386.0" cy="529.6" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="386.0" y="534.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<text x="370.0" y="565.6" font-size="13" fill="#4e1d24" font-weight="bold">Cement and implants</text>
<text x="370.0" y="602.0" font-size="13" fill="#8a7b74">Lavage, cement, tray,</text>
<text x="370.0" y="619.2" font-size="13" fill="#8a7b74">femur, insert; 10-12 min</text>
<text x="370.0" y="636.4" font-size="13" fill="#8a7b74">to cure in extension.</text>
<rect x="370.0" y="664.8" width="160.0" height="138.4" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="378.0" y="683.8" font-size="13" fill="#241a18">Cement reaction of any</text>
<text x="378.0" y="701.0" font-size="13" fill="#241a18">grade in about a</text>
<text x="378.0" y="718.2" font-size="13" fill="#241a18">quarter, usually grade</text>
<text x="378.0" y="735.4" font-size="13" fill="#241a18">1. Second tranexamic</text>
<text x="378.0" y="752.6" font-size="13" fill="#241a18">acid dose and</text>
<text x="378.0" y="769.8" font-size="13" fill="#241a18">ondansetron while it</text>
<text x="378.0" y="787.0" font-size="13" fill="#241a18">sets.</text>
<circle cx="559.0" cy="529.6" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="559.0" y="534.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">9</text>
<text x="543.0" y="565.6" font-size="13" fill="#4e1d24" font-weight="bold">Infiltration, closure,</text>
<text x="543.0" y="582.8" font-size="13" fill="#4e1d24" font-weight="bold">cuff down</text>
<text x="543.0" y="602.0" font-size="13" fill="#8a7b74">Posterior capsule</text>
<text x="543.0" y="619.2" font-size="13" fill="#8a7b74">injected before the final</text>
<text x="543.0" y="636.4" font-size="13" fill="#8a7b74">components, then the rest</text>
<text x="543.0" y="653.6" font-size="13" fill="#8a7b74">at closure.</text>
<rect x="543.0" y="664.8" width="160.0" height="138.4" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="551.0" y="683.8" font-size="13" fill="#241a18">Count the dose: 300 mg</text>
<text x="551.0" y="701.0" font-size="13" fill="#241a18">infiltrated plus 100 mg</text>
<text x="551.0" y="718.2" font-size="13" fill="#241a18">in the block. Deflation:</text>
<text x="551.0" y="735.4" font-size="13" fill="#241a18">pressure falls, CO2 and</text>
<text x="551.0" y="752.6" font-size="13" fill="#241a18">potassium rise.</text>
<circle cx="732.0" cy="529.6" r="14" fill="#4e1d24" stroke="#4e1d24" stroke-width="1"/>
<text x="732.0" y="534.6" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">10</text>
<text x="716.0" y="565.6" font-size="13" fill="#4e1d24" font-weight="bold">Recovery and first night</text>
<text x="716.0" y="602.0" font-size="13" fill="#8a7b74">Standing that afternoon;</text>
<text x="716.0" y="619.2" font-size="13" fill="#8a7b74">flexion to 90 degrees</text>
<text x="716.0" y="636.4" font-size="13" fill="#8a7b74">within a day or two.</text>
<rect x="716.0" y="664.8" width="160.0" height="138.4" rx="5" fill="#f7e6d2" stroke="#d98b3c" stroke-width="1.5" />
<text x="724.0" y="683.8" font-size="13" fill="#241a18">Spinal recedes in 2-4 h,</text>
<text x="724.0" y="701.0" font-size="13" fill="#241a18">block in 12-24 h:</text>
<text x="724.0" y="718.2" font-size="13" fill="#241a18">paracetamol and NSAID</text>
<text x="724.0" y="735.4" font-size="13" fill="#241a18">in before then. Pain 3</text>
<text x="724.0" y="752.6" font-size="13" fill="#241a18">that evening, 6 on days</text>
<text x="724.0" y="769.8" font-size="13" fill="#241a18">1 and 2.</text>
<rect x="24.0" y="821.2" width="852.0" height="91.8" rx="6" fill="#f3e9d8" stroke="#4e1d24" stroke-width="1.5" />
<text x="33.0" y="843.2" font-size="13" fill="#4e1d24" font-weight="bold">The tourniquet is the surgeon's choice, and the evidence is against routine use</text>
<text x="33.0" y="863.4" font-size="13" fill="#241a18">In 41 randomised trials a tourniquet raised serious adverse events from 29 to 59 per 1,000 and day 1 pain by 1.25 points, with no</text>
<text x="33.0" y="880.6" font-size="13" fill="#241a18">difference in function at a year. Surgeons vary from no cuff, to cement only, to the whole case. Make the short-tourniquet knee easy:</text>
<text x="33.0" y="897.8" font-size="13" fill="#241a18">tranexamic acid before incision, a normotensive patient and a working block.</text>
</svg>
