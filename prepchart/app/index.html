<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<title>PrepChart</title>
<style>
:root{
  --bg:#f4f6f7; --card:#ffffff; --ink:#14212b; --muted:#5d6b75; --line:#dde3e7;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f2ef; --warn:#b45309; --warn-soft:#fef3c7;
  --bad:#b91c1c; --bad-soft:#fee2e2; --chip:#eef2f4; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1417; --card:#172126; --ink:#e7eef1; --muted:#9aabb4; --line:#2a3840;
    --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36; --warn:#fbbf24; --warn-soft:#3a2d0c;
    --bad:#f87171; --bad-soft:#3b1414; --chip:#22303a; --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1417; --card:#172126; --ink:#e7eef1; --muted:#9aabb4; --line:#2a3840;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36; --warn:#fbbf24; --warn-soft:#3a2d0c;
  --bad:#f87171; --bad-soft:#3b1414; --chip:#22303a; --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.boot{padding:40px 16px;text-align:center;color:var(--muted)}
#app{max-width:860px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 8px;min-height:52px}
header.top h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .back{border:0;background:none;color:var(--accent);padding:6px 4px;cursor:pointer;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.small{padding:5px 10px;min-height:32px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow);min-height:96px}
.tile b{display:block;font-size:17px;margin-bottom:4px}
.tile span{color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li.tap{cursor:pointer}
.list .t{flex:1;min-width:0}
.list .t b{display:block;overflow:hidden;text-overflow:ellipsis}
.list .t small{color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;margin:8px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;min-height:40px}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;min-height:30px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.order{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.order:first-child{border-top:0}
.order .t{flex:1;min-width:0;cursor:pointer}
.order b{font-weight:600}
.order .dc{font-size:13px;color:var(--muted);margin-top:2px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;max-width:200px;border:0;background:none;padding:10px 4px 9px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.printbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:19;display:flex;justify-content:center;pointer-events:none}
.printbar .in{pointer-events:auto;width:100%;max-width:860px;padding:8px 16px;display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.printbar .btn{flex:1}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:16px;max-height:90vh}}
.sheet header{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 0 8px;z-index:2}
.sheet header h2{flex:1;margin:0;font-size:18px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.bad{background:var(--bad-soft)}
.auth{max-width:420px;margin:6vh auto 0}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.brand .logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.brand h1{margin:0;font-size:26px}
.proofwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.proofwrap canvas{display:block;width:100%;height:auto}
.builder{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:820px){#app.wide{max-width:1200px}.builder{grid-template-columns:1fr 320px}}
.bcanvas{position:relative;touch-action:none;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bcanvas canvas{display:block;width:100%;height:auto}
.palette{max-height:60vh;overflow:auto}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
.hide-names .pname{filter:blur(5px)}
.sr{position:absolute;left:-9999px}
details.adv summary{cursor:pointer;color:var(--accent);padding:6px 0}
.check{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.check input{width:20px;height:20px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--accent);color:var(--accent)}

</style>
</head>

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = (k) => {
    if (k === null || k === undefined || k === false) return;
    if (Array.isArray(k)) return k.forEach(add);
    el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  };
  kids.forEach(add);
  return el;
}
function appendAll(el, ...kids) { const add = (k) => { if (k === null || k === undefined || k === false) return; if (Array.isArray(k)) return k.forEach(add); el.appendChild(k instanceof Node ? k : document.createTextNode(String(k))); }; kids.forEach(add); return el; }
const $ = (s, r = document) => r.querySelector(s);

const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
function isoParts(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? { y: m[1], m: m[2], d: m[3] } : null; }
function ddmm(iso) { const p = isoParts(iso); return p ? p.d + '/' + p.m : ''; }
function ddmmyy(iso) { const p = isoParts(iso); return p ? p.d + '/' + p.m + '/' + p.y.slice(2) : ''; }
function ddmmyyyy(iso) { const p = isoParts(iso); return p ? p.d + '/' + p.m + '/' + p.y : ''; }
function niceDate(iso) {
  const p = isoParts(iso); if (!p) return '';
  const d = new Date(+p.y, +p.m - 1, +p.d);
  return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function download(name, text, type = 'application/json') {

/* ---------- local patient store (IndexedDB, this browser only) ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('prepchart', 1);
      r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('patients', { keyPath: 'id' }); db.createObjectStore('lists', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async all(store) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction(store).objectStore(store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); }); },
  async put(store, obj) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(obj); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(store, id) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async clear() { const db = await this.open(); return new Promise((res) => { const t = db.transaction(['patients', 'lists'], 'readwrite'); t.objectStore('patients').clear(); t.objectStore('lists').clear(); t.oncomplete = () => res(); }); },

const Cloud = {

  async pull() {

    const live = (data || []).filter((r) => !r.deleted);

/* PrepChart web: start up */
async function onSignedIn(user) {
  S.user = user;
  loadCache();
  applyTheme();
  render();
  try { await Cloud.pull(); } catch (e) { toast('Working from this browser’s copy: ' + (e.message || 'offline')); }

    h('p', null, 'Two quick things, then you can chart.'),
    h('div', { class: 'card' }, h('h2', null, '1. Your name on charts'),
