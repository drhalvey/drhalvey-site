<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><title>How is your recovery going?</title>
<style>
:root{color-scheme:light;--ink:#1d2a33;--muted:#5c6b75;--line:#d9e0e5;--acc:#0b6e6e;--bg:#f6f8f9}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:20px;margin:28px 0 6px;color:var(--acc)}
p{margin:6px 0}.muted{color:var(--muted);font-size:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q{font-weight:600;margin:0 0 8px}
.anch{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:4px 2px 0}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{height:48px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:17px;color:var(--ink);padding:0}
.scale button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.yn{display:flex;gap:10px}.yn button{flex:1;height:52px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
.yn button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.miss{outline:2px solid #c0392b;outline-offset:3px;border-radius:12px}
.big{display:block;width:100%;height:56px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:19px;font-weight:700;margin-top:18px}
.big:disabled{opacity:.5}.err{color:#c0392b;font-weight:600;margin-top:10px}
.done{text-align:center;padding:40px 10px}.tick{font-size:56px;color:var(--acc)}
.lock{font-size:13px;color:var(--muted);margin-top:6px}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
</style></head><body><main id="m"><p class="muted">Loading…</p></main>
<script>// Shared sealing code for the PROMs pages. Ephemeral ECDH P-256 + HKDF-SHA256 + AES-256-GCM (ECIES pattern).
// seal(pubJwk, obj) runs on the patient's phone; open(privJwk, sealed) runs only in the clinician's browser.
const PROMS_INFO = new TextEncoder().encode("proms-v1");
const b64e = (u8) => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
async function promsAesKey(privKey, pubKey) {
  const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: pubKey }, privKey, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: PROMS_INFO }, hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function promsSeal(pubJwk, obj) {
  const pub = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: pubJwk.x, y: pubJwk.y }, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const eph = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const aes = await promsAesKey(eph.privateKey, pub);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aes, new TextEncoder().encode(JSON.stringify(obj)));
  const epk = await crypto.subtle.exportKey("jwk", eph.publicKey);
  return { v: 1, epk: { x: epk.x, y: epk.y }, iv: b64e(iv), ct: b64e(new Uint8Array(ct)) };
}
async function promsOpen(privJwk, sealed) {
  const priv = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: privJwk.x, y: privJwk.y, d: privJwk.d }, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveBits"]);
  const epk = await crypto.subtle.importKey("jwk", { kty: "EC", crv: "P-256", x: sealed.epk.x, y: sealed.epk.y }, { name: "ECDH", namedCurve: "P-256" }, false, []);
  const aes = await promsAesKey(priv, epk);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(sealed.iv) }, aes, b64d(sealed.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function promsGenerateKeypair() {
  const kp = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveBits"]);
  const priv = await crypto.subtle.exportKey("jwk", kp.privateKey);
  return { pub: { kty: "EC", crv: "P-256", x: priv.x, y: priv.y }, priv: { kty: "EC", crv: "P-256", x: priv.x, y: priv.y, d: priv.d } };
}
// Private key as one pasteable string for a password manager.
const promsEncodePriv = (priv) => "proms-key-v1." + b64e(new TextEncoder().encode(JSON.stringify({ x: priv.x, y: priv.y, d: priv.d })));
function promsDecodePriv(s) {
  s = (s || "").trim();
  if (!s.startsWith("proms-key-v1.")) throw new Error("not a proms key");
  const j = JSON.parse(new TextDecoder().decode(b64d(s.slice(13))));
  if (!j.x || !j.y || !j.d) throw new Error("bad key");
  return { kty: "EC", crv: "P-256", x: j.x, y: j.y, d: j.d };
}
</script>
<script>
const BASE="https://bbwjroytqxynborrqylr.supabase.co/functions/v1/proms";const H={"content-type":"application/json","x-region":"ap-southeast-2"};
const t=new URLSearchParams(location.search).get("t")||"";
const m=document.getElementById("m");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data=null;const answers={};
function render(){
  if(!data||data.status==="unknown"){m.innerHTML='<div class="card"><h1>Link not recognised</h1><p>This link does not match a current questionnaire. If you were sent it by your anaesthetist, please reply to the message you received.</p></div>';return}
  const who=data.clinician?esc(data.clinician):"your anaesthetist";
  if(data.status==="done"){m.innerHTML='<div class="done"><div class="tick">&#10003;</div><h1>Thank you</h1><p>There is nothing to fill in right now. '+who+' is grateful for your answers.</p></div>';return}
  if(data.status==="upcoming"){m.innerHTML='<div class="done"><h1>Not yet</h1><p>Your next questionnaire opens on <b>'+esc(data.opens)+'</b>. Keep this link; you will get a reminder.</p></div>';return}
  let h='<h1>How is your recovery going?</h1><p class="muted">'+esc(data.label)+' (operation on '+esc(data.date)+'). About 2 minutes.</p><p class="lock">&#128274; Your answers are locked on this phone before they are sent and can only be opened by '+who+'.</p>';
  for(const ins of data.instruments){
    h+='<h2>'+esc(ins.title)+'</h2>'+(ins.intro?'<p class="muted">'+esc(ins.intro)+'</p>':'');
    answers[ins.id]=answers[ins.id]||{};
    for(const it of ins.items){
      const k=ins.id+"."+it.id;
      h+='<div class="card" id="c-'+k+'"><p class="q">'+esc(it.text)+'</p>';
      if(it.type==="scale"){h+='<div class="scale" data-k="'+k+'">';for(let i=0;i<=10;i++)h+='<button type="button" data-v="'+i+'">'+i+'</button>';h+='</div><div class="anch"><span>0 = '+esc(it.lo||"")+'</span><span>10 = '+esc(it.hi||"")+'</span></div>'}
      else{h+='<div class="yn" data-k="'+k+'"><button type="button" data-v="yes">Yes</button><button type="button" data-v="no">No</button></div>'}
      h+='</div>'}
  }
  h+='<button class="big" id="send">Send my answers</button><div class="err" id="err"></div><footer>Your answers are encrypted on your phone, stored in Australia, and used only for your care and for improving anaesthetic care. Do not use this form for anything urgent: if you are unwell, contact the hospital or call 000.</footer>';
  m.innerHTML=h;
  m.querySelectorAll(".scale button,.yn button").forEach(b=>b.addEventListener("click",()=>{
    const wrap=b.parentElement,[ins,item]=wrap.dataset.k.split(".");
    wrap.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    answers[ins][item]=wrap.classList.contains("scale")?Number(b.dataset.v):(b.dataset.v==="yes");
    document.getElementById("c-"+wrap.dataset.k).classList.remove("miss");
  }));
  document.getElementById("send").addEventListener("click",submit);
}
async function submit(){
  let first=null;
  for(const ins of data.instruments)for(const it of ins.items){if(answers[ins.id][it.id]===undefined){const c=document.getElementById("c-"+ins.id+"."+it.id);c.classList.add("miss");if(!first)first=c}}
  if(first){document.getElementById("err").textContent="Please answer the highlighted questions.";first.scrollIntoView({behavior:"smooth",block:"center"});return}
  const btn=document.getElementById("send");btn.disabled=true;btn.textContent="Locking and sending…";
  try{const sealed=await promsSeal(data.pubkey,{timepoint:data.timepoint,answers,at:new Date().toISOString()});
    const r=await fetch(BASE+"/api/submit",{method:"POST",headers:H,body:JSON.stringify({t,timepoint:data.timepoint,sealed})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"failed");
    m.innerHTML='<div class="done"><div class="tick">&#10003;</div><h1>Thank you</h1><p>Your answers have been sent. Keep this link; the next questionnaire will open when it is due.</p></div>';window.scrollTo(0,0);
  }catch(e){btn.disabled=false;btn.textContent="Send my answers";document.getElementById("err").textContent="Could not send. Please check your connection and try again."}
}
fetch(BASE+"/api/next?t="+encodeURIComponent(t),{headers:{"x-region":"ap-southeast-2"}}).then(r=>r.json()).then(j=>{data=j.error?{status:"unknown"}:j;render()}).catch(()=>{data={status:"unknown"};render()});
</script></body></html>
