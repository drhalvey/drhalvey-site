      ';</' + 'script>';

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

r your questions, and confirm the plan with you.\"},{\"name\":\"Drip\",\"short\":\"Drip\",\"motif\":\"drip\",\"title\":\"A small drip goes into your hand or arm\",\"body\":\"It gives you fluid and medicines, including an antibiotic before the birth. Monitors are placed for your blood pressure, heart rate and oxygen.\"},{\"name\":\"Spinal\",\"short\":\"Spinal\",\"motif\":\"ripple\",\"title\":\"A spinal injection numbs you from the waist down\",\"body\":\"You sit and curl over your bump. Local anaesthetic numbs the skin first, then most people feel only pushing. Your legs become warm, then heavy, then numb.\"},{\"name\":\"Checking\",\"short\":\"Checking\",\"motif\":\"monitor\",\"title\":\"We check the anaesthetic is fully working\",\"body\":\"Simple tests with something cold or soft, and lifting your legs. Your obstetrician only starts once I am satisfied you are numb.\"},{\"name\":\"Screen\",\"short\":\"During the birth\",\"motif\":\"screen\",\"title\":\"A screen separates you from the surgery\",\"body\":\"Your partner sits beside you and I stay with you the whole time. Pressure and pulling are normal, pain is not. Tell me about anything you feel.\"},{\"name\":\"Baby\",\"short\":\"Your baby\",\"motif\":\"baby\",\"title\":\"Your baby is born early in the operation\",\"body\":\"The midwife and paediatrician check your baby, then you can have skin to skin contact while the obstetrician finishes the operation.\"},{\"name\":\"Recovery\",\"short\":\"Recovery\",\"motif\":\"sun\",\"title\":\"Your partner and baby are with you in recovery\",\"body\":\"Feeling returns to your legs over a couple of hours. Morphine given with the spinal keeps you comfortable well into the first day.\"},{\"name\":\"Home\",\"short\":\"Pain relief\",\"motif\":\"pills\",\"title\":\"Regular pain relief so you can care for your baby\",\"body\":\"Celecoxib and paracetamol regularly for five days, with extra medicine only if you need it. Your own plan is written down for you.\"}]}';<\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"position:relative;width:100%;height:100vh;background:#fbf6ef\">\n  <x-import component-from-global-scope=\"JourneyApp\" from=\"0e1c4777-4c98-4799-83a4-f6580d50a241#/animations-v3.js 21eea798-cbef-4ae5-95ef-fed6d3bab773#/journey.js\" hint-size=\"100%,100%\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
